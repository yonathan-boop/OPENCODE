<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ular Tangga vs AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at 20% 20%, #2c5364, #0f2027);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #e8f4f8;
  }
  .game {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    max-width: 1020px;
    width: 100%;
  }
  .board-wrap { flex: 0 0 auto; position: relative; }
  .board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    width: min(580px, 80vw);
    aspect-ratio: 1;
    gap: 2px;
    background: #1a2f3a;
    padding: 6px;
    border-radius: 16px;
    box-shadow: 0 22px 50px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.06);
  }
  .svg-board {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    padding: 6px;
    border-radius: 10px;
  }
  .cell {
    position: relative;
    background: linear-gradient(180deg, #2a5062, #24495a);
    border-radius: 6px;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    font-size: 10px;
    font-weight: 700;
    color: #9fc4d3;
    user-select: none;
    padding: 2px 4px;
    z-index: 2;
  }
  .cell.green { background: linear-gradient(180deg, #3d5a3f, #33503a); color: #e6f7d4; }
  .cell.red   { background: linear-gradient(180deg, #5a3434, #4e2d2d); color: #ffd9d9; }
  .cell.star  { background: linear-gradient(180deg, #4a4a75, #40406a); color: #ffd54f; }
  .cell .st { font-size: 9px; }

  /* ====== Token pions ====== */
  .token {
    position: absolute;
    width: 26%;
    height: 26%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    z-index: 6;
    box-shadow: 0 4px 8px rgba(0,0,0,.55);
    border: 2px solid rgba(255,255,255,.85);
    transition: left .18s ease, top .18s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
  .token.p1 { background: radial-gradient(circle at 30% 30%, #6fd3ff, #1e88e5); }
  .token.p2 { background: radial-gradient(circle at 30% 30%, #ffab91, #e53935); }
  .token.move-fast { transition-duration: .7s; }
  .token.flash {
    animation: flash .5s ease;
  }
  @keyframes flash {
    0% { filter: brightness(2.4); transform: translate(-50%,-50%) scale(1.25); }
    100% { filter: none; transform: translate(-50%,-50%) scale(1); }
  }

  /* ====== Panel samping ====== */
  .side {
    flex: 1 1 290px;
    max-width: 330px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  h1 { font-size: 20px; letter-spacing: .5px; }
  .players { display: flex; flex-direction: column; gap: 8px; }
  .player {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(0,0,0,.25);
    border: 2px solid transparent;
    transition: border-color .2s, background .2s;
  }
  .player.active { border-color: #ffd54f; background: rgba(255,213,79,.08); }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: 0 0 auto; }
  .dot.p1 { background: #42a5f5; }
  .dot.p2 { background: #ef5350; }
  .player .name { font-weight: 600; flex: 1; }
  .player .pos { color: #9fc4d3; font-weight: 600; }

  /* ====== Dadu berputar ====== */
  .dice-area { text-align: center; padding: 6px 0 2px; }
  .dice-wrap { position: relative; width: 96px; height: 96px; margin: 0 auto 12px; perspective: 500px; }
  .dice {
    position: absolute;
    inset: 0;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 12px 28px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.9), inset 0 -4px 14px rgba(0,0,0,.12);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 14px;
    gap: 2px;
    transform-style: preserve-3d;
    transition: transform .35s cubic-bezier(.2,.7,.3,1.2);
  }
  .dice.rolling { animation: diceSpin .45s linear infinite; }
  @keyframes diceSpin {
    0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1); }
    25% { transform: rotateX(180deg) rotateY(60deg) rotateZ(12deg) scale(1.08); }
    50% { transform: rotateX(360deg) rotateY(180deg) rotateZ(-12deg) scale(1); }
    75% { transform: rotateX(540deg) rotateY(240deg) rotateZ(12deg) scale(1.1); }
    100% { transform: rotateX(720deg) rotateY(360deg) rotateZ(0deg) scale(1); }
  }
  .pip {
    width: 13px;
    height: 13px;
    margin: auto;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #3a3a4a, #15151e);
    box-shadow: 0 1px 2px rgba(0,0,0,.6);
    opacity: 0;
    transform: scale(.4);
    transition: opacity .08s, transform .08s;
  }
  .pip.on { opacity: 1; transform: scale(1); }
  .pip.hot { opacity: 1; transform: scale(1.35); background: radial-gradient(circle at 35% 35%, #ffd54f, #f57c00); box-shadow: 0 0 10px rgba(255,193,7,.9); }

  .btn {
    appearance: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    padding: 13px 18px;
    border-radius: 12px;
    color: #0f2027;
    background: linear-gradient(180deg, #ffd54f, #ffb300);
    box-shadow: 0 6px 16px rgba(0,0,0,.4);
    transition: transform .1s, opacity .2s, box-shadow .2s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(255,179,0,.35); }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn.secondary {
    background: rgba(255,255,255,.14);
    color: #e8f4f8;
    border: 1px solid rgba(255,255,255,.2);
  }
  .status {
    font-size: 14px;
    min-height: 46px;
    line-height: 1.5;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(0,0,0,.3);
    color: #dbeef5;
  }
  .win-banner {
    display: none;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    padding: 12px;
    border-radius: 10px;
    background: linear-gradient(90deg, #ffd54f, #ffb300);
    color: #0f2027;
  }
  .win-banner.show { display: block; animation: popIn .4s ease; }
  @keyframes popIn { 0% { transform: scale(.5); } 100% { transform: scale(1); } }
  .log {
    font-size: 12.5px;
    max-height: 120px;
    overflow: auto;
    padding: 8px 10px;
    background: rgba(0,0,0,.25);
    border-radius: 10px;
    color: #9fc4d3;
    line-height: 1.6;
  }
  .confetti {
    position: fixed; top: -10px; width: 10px; height: 16px; z-index: 99;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .0; } }
</style>
</head>
<body>
<div class="game">
  <div class="board-wrap">
    <div class="board" id="board">
      <svg class="svg-board" id="svgBoard" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <div class="side">
    <h1>🎲 Ular Tangga vs AI</h1>

    <div class="players">
      <div class="player active" id="pl1">
        <div class="dot p1"></div>
        <div class="name">Kamu</div>
        <div class="pos" id="pos1">Posisi: 0</div>
      </div>
      <div class="player" id="pl2">
        <div class="dot p2"></div>
        <div class="name">AI Komputer</div>
        <div class="pos" id="pos2">Posisi: 0</div>
      </div>
    </div>

    <div class="dice-area">
      <div class="dice-wrap">
        <div class="dice" id="dice">
          <div class="pip"></div><div class="pip"></div><div class="pip"></div>
          <div class="pip"></div><div class="pip"></div><div class="pip"></div>
          <div class="pip"></div><div class="pip"></div><div class="pip"></div>
        </div>
      </div>
      <button class="btn" id="rollBtn" onclick="playerTurn()">🎲 Lempar Dadu</button>
    </div>

    <div class="status" id="status">Giliran Kamu. Klik "Lempar Dadu" untuk mulai.</div>
    <div class="win-banner" id="winBanner"></div>

    <div class="log" id="log"></div>
    <button class="btn secondary" onclick="resetGame()">🔄 Mulai Ulang</button>
  </div>
</div>

<script>
// ====== Papan: ular & tangga ======
const LADDERS = { 2:38, 8:31, 15:26, 21:42, 28:84, 36:44, 51:67, 71:91, 78:98 };
const SNAKES  = { 16:6, 47:26, 49:11, 62:19, 64:60, 87:24, 93:73, 95:75 };

const BOARD_SIZE = 100;
const state = {
  p1: 0, p2: 0,
  turn: 1,
  rolling: false,
  winner: null,
};

const boardEl = document.getElementById('board');
const svgEl = document.getElementById('svgBoard');
const diceEl = document.getElementById('dice');
const pips = Array.from(diceEl.querySelectorAll('.pip'));
const statusEl = document.getElementById('status');
const winBanner = document.getElementById('winBanner');
const logEl = document.getElementById('log');

// Pola titik dadu (indeks pip 0..8, 3x3)
const DICE_PATTERN = {
  1: [4],
  2: [0, 8],
  3: [0, 4, 8],
  4: [0, 2, 6, 8],
  5: [0, 2, 4, 6, 8],
  6: [0, 2, 3, 5, 6, 8],
};

// ====== Geometri papan: koordinat SVG 0..100 ======
function cellCenter(n) {
  const rb = Math.floor((n - 1) / 10);          // baris dari bawah, 0 = bawah
  const c01 = (n - 1) % 10;
  const col = rb % 2 === 0 ? c01 : 9 - c01;     // zig-zag
  const row = rb % 2 === 0 ? 9 - rb : 9 - rb;
  return { x: col * 10 + 5, y: 100 - (rb * 10) - 5 };
}

// ====== Gambar tangga dengan SVG ======
function drawLadder(from, to) {
  const a = cellCenter(from);
  const b = cellCenter(to);
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  // offset tegak lurus untuk dua rel tangga
  const px = -dy / len, py = dx / len;
  const off = 3.2;
  const ns = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  let g = drawOn(svgEl);
  // dua rel
  for (const s of [-1, 1]) {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', a.x + px * off * s);
    line.setAttribute('y1', a.y + py * off * s);
    line.setAttribute('x2', b.x + px * off * s);
    line.setAttribute('y2', b.y + py * off * s);
    line.setAttribute('stroke', '#b98a3e');
    line.setAttribute('stroke-width', '1.6');
    line.setAttribute('stroke-linecap', 'round');
    g.appendChild(line);
  }
  // anak tangga
  const steps = 6;
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const x1 = a.x + dx * t - px * off;
    const y1 = a.y + dy * t - py * off;
    const x2 = a.x + dx * t + px * off;
    const y2 = a.y + dy * t + py * off;
    const rung = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    rung.setAttribute('x1', x1); rung.setAttribute('y1', y1);
    rung.setAttribute('x2', x2); rung.setAttribute('y2', y2);
    rung.setAttribute('stroke', '#d8a95a');
    rung.setAttribute('stroke-width', '1.2');
    rung.setAttribute('stroke-linecap', 'round');
    g.appendChild(rung);
  }
}

// ====== Gambar ular dengan SVG ======
function drawSnake(headN, tailN) {
  const head = cellCenter(headN);   // kepala (nomor tinggi, kepala ular di kotak ini)
  const tail = cellCenter(tailN);   // ekor
  const mx = (head.x + tail.x) / 2;
  const my = (head.y + tail.y) / 2;
  // kontrol kurva S: melebar keluar dari garis lurus
  const perp = { x: -(head.y - tail.y), y: (head.x - tail.x) };
  const pl = Math.hypot(perp.x, perp.y) || 1;
  const bulge = Math.min(18, Math.max(10, pl * 0.18));
  const c1 = { x: mx + perp.x / pl * bulge * 1, y: my + perp.y / pl * bulge };
  const c2 = { x: mx - perp.x / pl * bulge, y: my - perp.y / pl * bulge };

  const g = drawOn(svgEl);
  // badan utama (stroke tebal)
  const body = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  body.setAttribute('d', `M ${tail.x} ${tail.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${head.x} ${head.y}`);
  body.setAttribute('fill', 'none');
  body.setAttribute('stroke', '#5c8f3f');
  body.setAttribute('stroke-width', '2.6');
  body.setAttribute('stroke-linecap', 'round');
  g.appendChild(body);
  // garis perut
  const belly = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  belly.setAttribute('d', `M ${tail.x} ${tail.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${head.x} ${head.y}`);
  belly.setAttribute('fill', 'none');
  belly.setAttribute('stroke', '#c8e6a0');
  belly.setAttribute('stroke-width', '0.9');
  belly.setAttribute('stroke-dasharray', '2 1.4');
  belly.setAttribute('stroke-linecap', 'round');
  g.appendChild(belly);
  // kepala
  const ang = Math.atan2(head.y - c2.y, head.x - c2.x);
  const hx = head.x + Math.cos(ang) * 1.2, hy = head.y + Math.sin(ang) * 1.2;
  const hc = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  hc.setAttribute('cx', hx); hc.setAttribute('cy', hy);
  hc.setAttribute('r', '3.2');
  hc.setAttribute('fill', '#7cb342');
  hc.setAttribute('stroke', '#33691e');
  hc.setAttribute('stroke-width', '0.8');
  g.appendChild(hc);
  // mata
  const pxx = -Math.sin(ang), pyy = Math.cos(ang);
  for (const s of [-1, 1]) {
    const eye = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    eye.setAttribute('cx', hx + Math.cos(ang) * 1.4 + pxx * s * 1.4);
    eye.setAttribute('cy', hy + Math.sin(ang) * 1.4 + pyy * s * 1.4);
    eye.setAttribute('r', '0.85');
    eye.setAttribute('fill', '#111');
    g.appendChild(eye);
  }
  // lidah bercabang
  const tx = hx + Math.cos(ang) * 4.2, ty = hy + Math.sin(ang) * 4.2;
  const tong1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  tong1.setAttribute('x1', tx); tong1.setAttribute('y1', ty);
  tong1.setAttribute('x2', tx + (Math.cos(ang) - pxx) * 1.8);
  tong1.setAttribute('y2', ty + (Math.sin(ang) - pyy) * 1.8);
  tong1.setAttribute('stroke', '#e53935'); tong1.setAttribute('stroke-width', '0.7'); tong1.setAttribute('stroke-linecap', 'round');
  g.appendChild(tong1);
  const tong2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  tong2.setAttribute('x1', tx); tong2.setAttribute('y1', ty);
  tong2.setAttribute('x2', tx + (Math.cos(ang) + pxx) * 1.8);
  tong2.setAttribute('y2', ty + (Math.sin(ang) + pyy) * 1.8);
  tong2.setAttribute('stroke', '#e53935'); tong2.setAttribute('stroke-width', '0.7'); tong2.setAttribute('stroke-linecap', 'round');
  g.appendChild(tong2);
}

function drawOn(svg) {
  // group agar mudah dihapus saat reset
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'deco');
  svg.appendChild(g);
  return g;
}

// ====== Bangun papan & token ======
function buildBoard() {
  boardEl.querySelectorAll('.cell').forEach(c => c.remove());
  for (let rb = 9; rb >= 0; rb--) {
    for (let col = 0; col < 10; col++) {
      let n;
      const even = rb % 2 === 0;
      n = rb * 10 + (even ? col + 1 : 10 - col);
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (LADDERS[n]) cell.classList.add('green');
      else if (SNAKES[n]) cell.classList.add('red');
      if (n === BOARD_SIZE) cell.classList.add('star');
      cell.id = 'cell-' + n;
      const st = document.createElement('span');
      st.textContent = n;
      cell.appendChild(st);
      cell.dataset.n = n;
      boardEl.appendChild(cell);
    }
  }
  // token
  const t1 = document.createElement('div');
  t1.className = 'token p1'; t1.id = 'tok1'; t1.textContent = 'K';
  const t2 = document.createElement('div');
  t2.className = 'token p2'; t2.id = 'tok2'; t2.textContent = 'A';
  boardEl.appendChild(t1);
  boardEl.appendChild(t2);
}

function placeTokens(instant) {
  [[1, 'tok1'], [2, 'tok2']].forEach(([p, id]) => {
    const tok = document.getElementById(id);
    const pos = p === 1 ? state.p1 : state.p2;
    const c = cellCenter(Math.max(pos, 1));
    const dur = instant ? '0s' : '.18s';
    tok.style.transition = 'left ' + dur + ' ease, top ' + dur + ' ease';
    const pct = 6 / 580 * 100; // padding 6px, board 580px => offset
    tok.style.left = (c.x + pct / 2) + '%';
    tok.style.top = (c.y + pct / 2) + '%';
  });
}

function markTokenFlash(player) {
  const tok = document.getElementById(player === 1 ? 'tok1' : 'tok2');
  tok.classList.remove('flash');
  void tok.offsetWidth;
  tok.classList.add('flash');
}

// ====== Dadu ======
function rollDice() { return 1 + Math.floor(Math.random() * 6); }

function showPips(value, hot) {
  pips.forEach((pip, i) => {
    pip.classList.toggle('on', (DICE_PATTERN[value] || []).includes(i));
    pip.classList.toggle('hot', !!(hot && (DICE_PATTERN[value] || []).includes(i)));
  });
}

function animateDice(callback) {
  state.rolling = true;
  diceEl.classList.add('rolling');
  let frames = 0;
  const totalFrames = 14;
  const timer = setInterval(() => {
    const v = rollDice();
    showPips(v, frames % 3 === 0);
    frames++;
    if (frames >= totalFrames) {
      clearInterval(timer);
      const value = rollDice();
      showPips(value, true);
      setTimeout(() => {
        diceEl.classList.remove('rolling');
        showPips(value, false);
        state.rolling = false;
        callback(value);
      }, 350);
    }
  }, 80);
}

// ====== Log & status ======
function log(msg) {
  const el = document.createElement('div');
  el.innerHTML = msg;
  logEl.prepend(el);
  while (logEl.children.length > 40) logEl.removeChild(logEl.lastChild);
}

function setStatus(msg) { statusEl.textContent = msg; }

function updateUI() {
  document.getElementById('pos1').textContent = 'Posisi: ' + state.p1;
  document.getElementById('pos2').textContent = 'Posisi: ' + state.p2;
  document.getElementById('pl1').classList.toggle('active', state.turn === 1 && !state.winner);
  document.getElementById('pl2').classList.toggle('active', state.turn === 2 && !state.winner);
}

// ====== Gerak token ======
function moveToken(player, from, to, onDone) {
  const key = player === 1 ? 'p1' : 'p2';
  const id = player === 1 ? 'tok1' : 'tok2';
  const tok = document.getElementById(id);
  const step = from < to ? 1 : -1;
  let cur = from;
  tok.classList.add('move-fast');
  const total = Math.abs(to - from) / 10;
  const baseInterval = Math.max(45, 160 - total * 8);

  const interval = setInterval(() => {
    cur += step;
    state[key] = cur;
    const c = cellCenter(Math.max(cur, 1));
    tok.style.left = c.x + '%';
    tok.style.top = c.y + '%';
    updateUI();
    if (cur === to) {
      clearInterval(interval);
      tok.classList.remove('move-fast');
      onDone();
    }
  }, baseInterval);
}

function resolveLanding(player) {
  const pos = player === 1 ? state.p1 : state.p2;
  const key = player === 1 ? 'p1' : 'p2';
  const name = player === 1 ? 'Kamu' : 'AI';

  if (LADDERS[pos]) {
    log('⬆️ ' + name + ' menaiki tangga: ' + pos + ' → ' + LADDERS[pos]);
    setStatus(name + ' menaiki tangga ke kotak ' + LADDERS[pos] + '!');
    state[key] = LADDERS[pos];
    placeTokens(true);
    markTokenFlash(player);
  } else if (SNAKES[pos]) {
    log('🐍 ' + name + ' digigit ular! ' + pos + ' → ' + SNAKES[pos]);
    setStatus(name + ' digigit ular, turun ke kotak ' + SNAKES[pos] + '…');
    state[key] = SNAKES[pos];
    placeTokens(true);
    markTokenFlash(player);
  }
  updateUI();
  checkWin(player);
}

function checkWin(player) {
  const pos = player === 1 ? state.p1 : state.p2;
  if (pos === BOARD_SIZE) {
    state.winner = player;
    const name = player === 1 ? 'Kamu' : 'AI Komputer';
    winBanner.textContent = '🏆 ' + name + ' menang!';
    winBanner.classList.add('show');
    setStatus(name + ' berhasil mencapai 100! 🎉');
    document.getElementById('rollBtn').disabled = true;
    log('🏆 ' + name + ' MENANG!');
    confetti();
    return true;
  }
  return false;
}

function confetti() {
  const colors = ['#ffd54f', '#ff7043', '#42a5f5', '#8bc34a', '#ab47bc', '#ff8a65'];
  for (let i = 0; i < 90; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    el.style.animationDelay = (Math.random() * 0.6) + 's';
    el.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

// ====== Giliran ======
function endTurn(next) {
  state.turn = next;
  updateUI();
  const btn = document.getElementById('rollBtn');
  if (next === 1 && !state.winner) {
    btn.disabled = false;
    setStatus('Giliran Kamu. Tekan "Lempar Dadu".');
  } else if (next === 2 && !state.winner) {
    btn.disabled = true;
    setTimeout(aiTurn, 500);
  }
}

function applyMove(player, value) {
  const key = player === 1 ? 'p1' : 'p2';
  const start = state[key];
  if (start + value > BOARD_SIZE) {
    const need = BOARD_SIZE - start;
    const name = player === 1 ? 'Kamu' : 'AI';
    setStatus(name + ' dapat ' + value + ' (butuh pas ' + need + '). Tidak jalan.');
    log('🎲 ' + name + ' dapat ' + value + ', butuh pas ' + need + '.');
    endTurn(player === 1 ? 2 : 1);
    return;
  }
  moveToken(player, start, start + value, () => {
    resolveLanding(player);
    if (!state.winner) endTurn(player === 1 ? 2 : 1);
  });
}

function playerTurn() {
  if (state.winner || state.rolling || state.turn !== 1) return;
  document.getElementById('rollBtn').disabled = true;
  setStatus('Kamu melempar dadu…');
  log('🎲 Kamu melempar dadu.');
  animateDice(value => {
    log('Dadu ' + value + ' → dari ' + state.p1 + ' ke ' + Math.min(state.p1 + value, BOARD_SIZE));
    setStatus('Kamu jalan ke kotak ' + Math.min(state.p1 + value, BOARD_SIZE) + '…');
    applyMove(1, value);
  });
}

function aiTurn() {
  if (state.winner || state.rolling || state.turn !== 2) return;
  setStatus('AI berpikir…');
  log('🤖 AI melempar dadu.');
  setTimeout(() => {
    animateDice(value => {
      log('🤖 AI dapat dadu ' + value + ' → dari ' + state.p2 + ' ke ' + Math.min(state.p2 + value, BOARD_SIZE));
      setStatus('AI jalan ke kotak ' + Math.min(state.p2 + value, BOARD_SIZE) + '…');
      applyMove(2, value);
    });
  }, 450);
}

// ====== Reset ======
function resetGame() {
  state.p1 = 0; state.p2 = 0;
  state.turn = 1; state.winner = null; state.rolling = false;
  winBanner.classList.remove('show');
  winBanner.textContent = '';
  logEl.innerHTML = '';
  diceEl.classList.remove('rolling');
  showPips(0, false);
  setStatus('Giliran Kamu. Klik "Lempar Dadu" untuk mulai.');
  // hapus overlay dekorasi lalu gambar ulang
  svgEl.querySelectorAll('.deco').forEach(g => g.remove());
  drawDecorations();
  placeTokens(true);
  updateUI();
  document.getElementById('rollBtn').disabled = false;
}

function drawDecorations() {
  Object.keys(LADDERS).forEach(f => drawLadder(Number(f), LADDERS[f]));
  Object.keys(SNAKES).forEach(h => drawSnake(Number(h), SNAKES[h]));
}

// ====== Init ======
buildBoard();
placeTokens(true);
drawDecorations();
updateUI();
showPips(0, false);
</script>
